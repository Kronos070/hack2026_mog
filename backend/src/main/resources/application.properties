# Application Name and HTTP Config
quarkus.application.name=mog-backend
quarkus.http.port=${QUARKUS_HTTP_PORT:8080}
quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.http.cors.headers=accept, authorization, content-type, x-requested-with
quarkus.http.cors.methods=GET, POST, PUT, DELETE, OPTIONS, HEAD

# OpenAPI & Swagger UI (/q/swagger-ui)
quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.path=/q/openapi

# PostgreSQL Database Configuration
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://localhost:5432/mog_db}
quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME:mog_user}
quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD:mog_pass}
quarkus.datasource.jdbc.max-size=20
quarkus.datasource.jdbc.min-size=2

# Hibernate ORM & Flyway
quarkus.hibernate-orm.database.generation=none
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true

# SmallRye JWT Configuration
mp.jwt.verify.issuer=https://mog.stoloto.ru/issuer
smallrye.jwt.sign.key.location=privateKey.pem
mp.jwt.verify.publickey.location=publicKey.pem

# WebSockets Next
quarkus.websockets-next.path=/ws

# Logging
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n
quarkus.log.level=INFO
quarkus.log.category."com.hack2026.mog".level=DEBUG
